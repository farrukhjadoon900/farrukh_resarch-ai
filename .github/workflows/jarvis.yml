name: jarvis

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Command for Jarvis"
        required: true
        type: string
      mode:
        description: "auto | learn | answer | research"
        required: false
        default: auto
        type: string
      ntfy_topics:
        description: "Comma-separated ntfy topics"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/jarvis'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Resolve Prompt & Env Variables
        id: prompt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "text=${{ inputs.prompt }}" >> "$GITHUB_OUTPUT"
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            NTFY_INPUT="${{ inputs.ntfy_topics }}"
            echo "ntfy_topics=${NTFY_INPUT:-mfj-jarvis}" >> "$GITHUB_OUTPUT"
          else
            BODY="${{ github.event.comment.body }}"
            TEXT=$(echo "$BODY" | grep -i '/jarvis' | sed 's/.*\/jarvis[[:space:]]*//' | head -n 1)
            if [ -z "$TEXT" ]; then
              TEXT="Hello Jarvis"
            fi
            echo "text=$TEXT" >> "$GITHUB_OUTPUT"
            echo "mode=auto" >> "$GITHUB_OUTPUT"
            echo "ntfy_topics=mfj-jarvis" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Welcome Notification via ntfy
        env:
          NTFY_TOPICS: ${{ steps.prompt.outputs.ntfy_topics }}
        run: |
          WELCOME_MSG="Welcome farrukh apka ai system tyar hy."
          IFS=',' read -ra TOPICS <<< "${NTFY_TOPICS:-mfj-jarvis}"
          for TOPIC in "${TOPICS[@]}"; do
            CLEAN_TOPIC=$(echo "$TOPIC" | xargs)
            if [ -n "$CLEAN_TOPIC" ]; then
              echo "Sending welcome notification to: $CLEAN_TOPIC"
              curl -s --data-binary "$WELCOME_MSG" "https://ntfy.sh/$CLEAN_TOPIC"
            fi
          done

      - name: Run Jarvis
        env:
          GROQ_API_KEY: ${{ secrets.groq_api_key }}
          groq_api_key: ${{ secrets.groq_api_key }}
          MODEL_NAME: ${{ vars.MODEL_NAME || 'groq/llama3-8b-8192' }}
          NTFY_TOPICS: ${{ steps.prompt.outputs.ntfy_topics }}
        run: |
          export PYTHONPATH="${{ github.workspace }}/src"
          python -m jarvis.cli ask "${{ steps.prompt.outputs.text }}" --mode "${{ steps.prompt.outputs.mode }}" \
            | tee /tmp/jarvis_out.md

      - name: Commit new skills (if any)
        run: |
          git config user.name "jarvis-bot"
          git config user.email "jarvis@users.noreply.github.com"
          git add skills/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(skills): update from Jarvis run"
            git push
          else
            echo "No skill changes"
          fi

      - name: Reply on issue (comment trigger)
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '**Jarvis** finished.\n\n';
            try {
              if (fs.existsSync('/tmp/jarvis_out.md')) {
                body += fs.readFileSync('/tmp/jarvis_out.md', 'utf8').slice(0, 65000);
              } else {
                body += '_No output generated._';
              }
            } catch (e) {
              body += '_Error reading output file._';
            }
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Notify via ntfy (Completion)
        if: always()
        env:
          NTFY_TOPICS: ${{ steps.prompt.outputs.ntfy_topics }}
        run: |
          if [ -f /tmp/jarvis_out.md ]; then
            MSG=$(head -c 200 /tmp/jarvis_out.md)
          else
            MSG="Jarvis workflow execution completed."
          fi

          IFS=',' read -ra TOPICS <<< "${NTFY_TOPICS:-mfj-jarvis}"
          for TOPIC in "${TOPICS[@]}"; do
            CLEAN_TOPIC=$(echo "$TOPIC" | xargs)
            if [ -n "$CLEAN_TOPIC" ]; then
              echo "Sending completion notification to: $CLEAN_TOPIC"
              curl -s --data-binary "$MSG" "https://ntfy.sh/$CLEAN_TOPIC"
            fi
          done
