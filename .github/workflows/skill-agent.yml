

on:
  schedule:
    - cron: "0 9 * * *"   # daily 9am UTC â€” edit or remove as you like
  workflow_dispatch: {}
  issue_comment:
    types: [created]

concurrency:
  group: skill-agent-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run:
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '/sync-skills'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install httpx

      - name: Check API key secret
        env:
          KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret GROQ_API_KEY missing. Repo Settings -> Secrets -> Actions."
            exit 1
          fi
          echo "Secret GROQ_API_KEY OK (length ${#KEY})."

      - name: Run skill agent
        env:
          groq_api_key: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
        run: python scripts/skill_agent.py

      - name: Commit new skills
        run: |
          set -euo pipefail
          git config user.name "jarvis-bot"
          git config user.email "jarvis-bot@users.noreply.github.com"
          git add skills/
          if git diff --cached --quiet; then
            echo "No new skills this run."
          else
            git commit -m "jarvis-agent: sync + reshape skills [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "Skills pushed."
          fi

      - name: Reply on issue
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '**skill-agent** finished a sync cycle. Check the `skills/` folder for new additions.'
            });
