[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-crew"
version = "0.1.0"
description = "Groq + CrewAI Jarvis assistant with skill learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "crewai>=0.120.0",
  "crewai-tools>=0.40.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0",
  "rich>=13.0.0",
  "httpx>=0.27.0",
  "openai>=1.40.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
